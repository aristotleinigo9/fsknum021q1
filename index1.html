<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workplace Maths Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #1e88e5;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin: 1rem 0;
      color: var(--primary);
    }

    .question-text {
      font-size: 0.98rem;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .option {
      border-radius: 8px;
      border: 1px solid #dddddd;
      padding: 0.5rem 0.6rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #fafafa;
    }

    .option input {
      transform: scale(1.1);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-secondary {
      background: #eeeeee;
      color: #333333;
    }

    .result {
      text-align: center;
      margin-top: 0.8rem;
      font-weight: 600;
    }

    .correct {
      color: #2e7d32;
    }

    .incorrect {
      color: #c62828;
    }

    @media (max-width: 480px) {
      .card {
        padding: 0.8rem 0.9rem;
      }
      .option {
        font-size: 0.9rem;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FSKNUM021-Extract and Interpret Workplace Maths</h1>

    <!-- Questions -->
    <div id="quiz"></div>

    <!-- Controls -->
    <div class="card">
      <div class="btn-row">
        <button class="btn-primary" onclick="submitQuiz()">Submit</button>
        <button class="btn-secondary" onclick="resetQuiz()">Reset</button>
      </div>
      <div id="result" class="result"></div>
    </div>
    <div class="card">
      <l>Prepared by: Aristotle Inigo</l>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: 'A label reads: “Max load: 18 kg.” What mathematical information is given?',
        options: [
          'The minimum weight allowed',
          'The maximum weight that can be carried safely',
          'The average weight of items',
          'The total weight of all items'
        ],
        correctIndex: 1
      },
      {
        text: 'A roster shows: “Shift length: 7.5 hours.” What does the number represent?',
        options: [
          'The total hours worked in a week',
          'The overtime hours',
          'The time for a lunch break',
          'The length of one work shift'
        ],
        correctIndex: 3
      },
      {
        text: 'A chemical bottle says: “Dilute 1:3.” What does this ratio mean?',
        options: [
          '1 litre chemical and 3 litres water',
          '3 parts chemical to 1 part water',
          '1 part chemical to 3 parts water',
          '3 litres chemical and 1 litre water'
        ],
        correctIndex: 2
      },
      {
        text: 'A delivery note lists: “Boxes: 24, Damaged: 2.” What percentage are damaged?',
        options: [
          '2%',
          '24%',
          '12%',
          '8.3%'
        ],
        correctIndex: 3 // 2/24 = 0.0833 ≈ 8.3%
      },
      {
        text: 'A machine screen shows: “Temperature: 92°C, Limit: 95°C.” Is the temperature within safe range?',
        options: [
          'Yes, it is below the limit.',
          'No, it is above the limit.',
          'No, it is exactly at the limit.',
          'It cannot be determined.'
        ],
        correctIndex: 0
      },
      {
        text: 'A job ticket states: “Cut length: 1200 mm ± 2 mm.” What is the acceptable range?',
        options: [
          '2000 mm to 1202 mm',
          '1198 mm to 1202 mm',
          '1196 mm to 1204 mm',
          '1180 mm to 1220 mm'
        ],
        correctIndex: 1
      },
      {
        text: 'A report shows: “Output: 480 units, Target: 500 units.” Which statement is correct?',
        options: [
          'Output is 20 units over the target.',
          'Output cannot be determined.',
          'Output is within target.',
          'Output is 20 units short under the target.'
        ],
        correctIndex: 3
      },
      {
        text: 'A safety sign says: “Keep clear: 3 metres.” What does the number indicate?',
        options: [
          'The height of the sign',
          'The distance people must stay away',
          'The width of the doorway',
          'The length of the equipment'
        ],
        correctIndex: 1
      },
      {
        text: 'A packing list shows: “Cartons: 15, Items per carton: 12.” How many items total?',
        options: [
          '27 items',
          '120 items',
          '150 items',
          '180 items'
        ],
        correctIndex: 3 // 15 * 12 = 180
      },
      {
        text: 'A dashboard displays: “Reject rate: 4%, Limit: 3%.” What does this imply?',
        options: [
          'Reject rate is below the limit.',
          'Reject rate is at the limit.',
          'Reject rate is above the limit and may need action.',
          'Reject rate is not important.'
        ],
        correctIndex: 2
      }
    ];

    function renderQuiz() {
      const quizDiv = document.getElementById('quiz');
      quizDiv.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = `${qIndex + 1}. ${q.text}`;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        q.options.forEach((opt, optIndex) => {
          const label = document.createElement('label');
          label.className = 'option';

          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `q${qIndex}`;
          input.value = optIndex;

          label.appendChild(input);
          const span = document.createElement('span');
          span.textContent = opt;
          label.appendChild(span);

          optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);
        quizDiv.appendChild(card);
      });
    }

    function submitQuiz() {
      let score = 0;
      let unanswered = 0;

      questions.forEach((q, qIndex) => {
        const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
        if (!selected) {
          unanswered++;
          return;
        }
        const answerIndex = parseInt(selected.value, 10);
        if (answerIndex === q.correctIndex) {
          score++;
        }
      });

      const resultDiv = document.getElementById('result');
      if (unanswered > 0) {
        resultDiv.innerHTML =
          `<span class="incorrect">You left ${unanswered} question(s) unanswered.</span><br>` +
          `Score: ${score} / ${questions.length}`;
      } else {
        resultDiv.innerHTML =
          `<span class="correct">You scored ${score} out of ${questions.length}.</span>`;
      }
    }

    function resetQuiz() {
      document.getElementById('result').textContent = '';
      renderQuiz();
    }

    // Initial render
    renderQuiz();
  </script>
</body>
</html>
